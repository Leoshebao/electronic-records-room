[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = Asia/Shanghai

# NOTE: keep this file pure ASCII.
# Alembic reads the ini with the system locale encoding (GBK on zh-CN Windows),
# so non-ASCII characters here will break `alembic upgrade`.
# The real DSN is loaded by alembic/env.py from app.core.config.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
