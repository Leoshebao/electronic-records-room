services:
  postgres:
    image: postgres:16-alpine
    container_name: erecords-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erecords}
      POSTGRES_USER: ${POSTGRES_USER:-erecords}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erecords_pass}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erecords} -d ${POSTGRES_DB:-erecords}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erecords-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      API_HOST: 0.0.0.0
    volumes:
      - ./storage:/app/storage
      - ./backups:/app/backups
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: erecords-nginx
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
