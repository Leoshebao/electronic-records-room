# ============================================================================
# 电子资料室系统 - Nginx 配置（方案 B：Windows 本机部署，无 Docker）
#
# 启动方式（start.bat 已封装）：
#   nginx -p "%ROOT%\deploy\nginx" -c "%ROOT%\deploy\nginx\nginx.local.conf"
#
# 路径约定：以下相对路径均以 -p 指定的 prefix（deploy\nginx）为基准
#   证书   ../certs/server.crt
#   前端   ../../frontend/dist
# 若 nginx.exe 不在项目内，-p 仍必须指向 deploy\nginx，否则相对路径会错位。
# ============================================================================

worker_processes  auto;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Windows 下无系统 mime.types，直接内联常用类型，避免 include 失败
    default_type  application/octet-stream;
    types {
        text/html                 html htm;
        text/css                  css;
        application/javascript    js mjs;
        application/json          json;
        application/manifest+json webmanifest;
        image/svg+xml             svg;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/gif                 gif;
        image/webp                webp;
        image/x-icon              ico;
        font/woff                 woff;
        font/woff2                woff2;
        application/pdf           pdf;
        application/zip           zip;
        text/plain                txt log;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log  logs/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # 单文件上限 500MB，与后端 MAX_UPLOAD_MB 对齐并留余量
    client_max_body_size  600m;
    client_body_timeout   600s;
    client_header_timeout 60s;
    client_body_temp_path temp/client_body;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    # ---- TLS 全局参数：仅允许 1.2 / 1.3 ----
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ---- 唯一对外端口 8443（HTTPS）----
    server {
        listen       8443 ssl;
        server_name  _;

        ssl_certificate      ../certs/server.crt;
        ssl_certificate_key  ../certs/server.key;

        # 内网自签证书不启用 HSTS：IP 访问 + 证书更换时容易把客户端锁死
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        same-origin always;
        add_header X-Permitted-Cross-Domain-Policies none always;

        root   ../../frontend/dist;
        index  index.html;

        # 前端 SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的静态资源长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 运行时配置禁缓存：改 IP 后刷新即生效
        location = /config.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }

        # 后端 API 反代（FastAPI 仅监听 127.0.0.1:8000，不对外暴露）
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port  8443;

            proxy_connect_timeout    60s;
            proxy_send_timeout       600s;
            proxy_read_timeout       600s;
            proxy_request_buffering  off;
            proxy_buffering          off;
        }

        # 预览走流式，禁止缓冲
        location /api/files/preview/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host           $host;
            proxy_set_header X-Real-IP      $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering    off;
            proxy_read_timeout 600s;
        }
    }

    # 80 端口只做 301 跳转，不承载任何业务
    server {
        listen       80;
        server_name  _;
        return 301 https://$host:8443$request_uri;
    }
}
